{% extends "base.html" %}

{% block content %}
<div class="homepage-container">
    <!-- Tab Navigation with Japanese Brackets -->
    <div class="tab-navigation">
        <button class="tab-button active flex items-center gap-2" data-tab="articles" onclick="switchTab('articles')">
            <span class="tab-text"><i data-lucide="newspaper" class="w-4 h-4"></i> NHK Web Easy</span>
        </button>
        <button class="tab-button flex items-center gap-2" data-tab="paste" onclick="switchTab('paste')">
            <span class="tab-text"><i data-lucide="clipboard-paste" class="w-4 h-4"></i> Paste Text</span>
        </button>
    </div>

    <!-- Tab 1: Today's Articles -->
    <div id="articles-tab" class="tab-content active">
        <div class="section-header">
            <h2 class="section-title">Today's Articles</h2>
            <p class="section-subtitle">Select an article to analyze with AI</p>
        </div>
        
        <div id="articles-list" class="articles-grid">
            <!-- Loading skeleton -->
            <div class="loading-skeleton">
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
            </div>
        </div>
    </div>

    <!-- Tab 2: Paste Your Text -->
    <div id="paste-tab" class="tab-content">
        <div class="section-header">
            <h2 class="section-title">Analyze Japanese Text</h2>
            <p class="section-subtitle">Paste any Japanese text to get vocabulary, grammar, and cultural insights</p>
        </div>

        <div class="text-input-card">
            <div class="textarea-wrapper">
                <textarea 
                    id="japanese-text" 
                    class="japanese-textarea"
                    placeholder="Example：&#10;今日は美術館に行きました。とても面白かったです。"
                    maxlength="5000"
                    rows="10"
                ></textarea>
                <div class="character-counter">
                    <span id="char-count" class="char-count-number">0</span>
                    <span class="char-count-max"> / 5000</span>
                </div>
            </div>

            <div class="action-section">
                <button id="analyze-btn" class="analyze-button flex items-center gap-2">
                    <i data-lucide="search" class="w-4 h-4"></i>Analyze
                    <span class="button-glow"></span>
                </button>
                
                <!-- Loading Spinner -->
                <div id="loading-spinner" class="loading-spinner" style="display: none;">
                    <div class="spinner-ring"></div>
                    <p class="loading-text">Analyzing with watsonx.ai...</p>
                </div>
            </div>

            <!-- Error Message -->
            <div id="error-message" class="error-message" style="display: none;"></div>
        </div>
    </div>
</div>
{% endblock %}
